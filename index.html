<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
  :root{--bg:#0d0f14;--surface:#13161e;--surface2:#1a1e2a;--border:#252a38;--accent:#4f8ef7;--accent2:#7c5cfc;--green:#2ec87e;--red:#f05e6a;--yellow:#f5b942;--text:#e8eaf2;--muted:#6b728e;--mono:'DM Mono',monospace;--sans:'Noto Sans JP',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding:24px 16px 80px}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
  .header h1{font-size:22px;font-weight:700;background:linear-gradient(90deg,#4f8ef7,#7c5cfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .month-nav{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 14px}
  .month-nav button{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
  .month-nav span{font-family:var(--mono);font-size:14px;color:var(--text);min-width:80px;text-align:center}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:24px}
  .tab{flex:1;padding:8px 0;text-align:center;font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;color:var(--muted);border:none;background:none}
  .tab.active{background:linear-gradient(135deg,#4f8ef7,#7c5cfc);color:#fff}
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .3s}
  .card:focus-within::before{opacity:1}
  .card-label{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .card-label .dot{width:6px;height:6px;border-radius:50%}
  .dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-yellow{background:var(--yellow)}.dot-blue{background:var(--accent)}
  .card-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--mono);font-size:18px;font-weight:500;width:100%;outline:none;text-align:right}
  .card-input:focus{border-color:var(--accent)}
  .card-value{font-family:var(--mono);font-size:20px;font-weight:500;text-align:right;padding:6px 0}
  .card-value.green{color:var(--green)}.card-value.red{color:var(--red)}.card-value.yellow{color:var(--yellow)}.card-value.blue{color:var(--accent)}
  .summary-card{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
  .summary-title{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .summary-row:last-child{border-bottom:none}
  .summary-row .label{color:var(--muted)}.summary-row .value{font-family:var(--mono);font-weight:500}
  .section-title{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px}
  .chart-title{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
  canvas{max-height:220px}
  .save-btn-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 20px;background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:100}
  .save-btn{width:100%;padding:14px;background:linear-gradient(135deg,#4f8ef7,#7c5cfc);border:none;border-radius:12px;color:#fff;font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(79,142,247,.35)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--green);color:#fff;padding:10px 24px;border-radius:100px;font-size:13px;font-weight:600;transition:transform .3s ease;z-index:999}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .view{display:none}.view.active{display:block}
</style>
</head>
<body>
<div class="header">
  <h1>💴 家計簿</h1>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="monthLabel"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('input')">入力</button>
  <button class="tab" onclick="switchTab('summary')">サマリー</button>
  <button class="tab" onclick="switchTab('graph')">グラフ</button>
</div>
<div class="view active" id="view-input">
  <div class="section-title">収入</div>
  <div class="card-grid" style="grid-template-columns:1fr;">
    <div class="card"><div class="card-label"><span class="dot dot-green"></span>入（収入）</div><input class="card-input" id="in" type="number" placeholder="0" inputmode="numeric" oninput="recalc()"></div>
  </div>
  <div class="section-title">カード支出</div>
  <div class="card-grid">
    <div class="card"><div class="card-label"><span class="dot dot-red"></span>出（共通）</div><input class="card-input" id="outCommon" type="number" placeholder="0" inputmode="numeric" oninput="recalc()"></div>
    <div class="card"><div class="card-label"><span class="dot dot-red"></span>出（真）</div><input class="card-input" id="outMa" type="number" placeholder="0" inputmode="numeric" oninput="recalc()"></div>
    <div class="card" style="grid-column:1/-1;"><div class="card-label"><span class="dot dot-red"></span>出（末）</div><input class="card-input" id="outSue" type="number" placeholder="0" inputmode="numeric" oninput="recalc()"></div>
  </div>
  <div class="summary-card"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:var(--muted);">カード合計（出）</span><span class="card-value red" id="cardTotal" style="font-size:18px;">¥ 0</span></div></div>
  <div class="section-title">固定支出 / 貯金</div>
  <div class="card-grid">
    <div class="card"><div class="card-label"><span class="dot dot-yellow"></span>出（個）固定</div><input class="card-input" id="outFixed" type="number" placeholder="0" inputmode="numeric" oninput="recalc()"></div>
    <div class="card"><div class="card-label"><span class="dot dot-blue"></span>貯金額</div><input class="card-input" id="savings" type="number" placeholder="0" inputmode="numeric" oninput="recalc()"></div>
  </div>
  <div class="summary-card"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:var(--muted);">総支出</span><span class="card-value red" id="totalOut" style="font-size:18px;">¥ 0</span></div></div>
</div>
<div class="save-btn-wrap" id="saveBtnWrap">
  <button class="save-btn" onclick="saveMonth()">この月を保存する</button>
</div>
<div class="view" id="view-summary">
  <div class="summary-card" id="summaryContent"><p style="color:var(--muted);font-size:14px;text-align:center;padding:20px 0;">データがありません</p></div>
</div>
<div class="view" id="view-graph">
  <div class="chart-card"><div class="chart-title">月別 収入 / 総支出 / 貯金</div><canvas id="lineChart"></canvas></div>
  <div class="chart-card"><div class="chart-title">今月の支出内訳</div><canvas id="pieChart"></canvas></div>
</div>
<div class="toast" id="toast">保存しました ✓</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyDrHH3M2MbZY_ExWaY_b9asGuXeiSfA9cE",
  authDomain: "kakeibo-project-78ce8.firebaseapp.com",
  databaseURL: "https://kakeibo-project-78ce8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kakeibo-project-78ce8",
  storageBucket: "kakeibo-project-78ce8.firebasestorage.app",
  messagingSenderId: "899193496036",
  appId: "1:899193496036:web:02df30b56f6cbbe0dfe7f1"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dbRef = (path) => ref(db, path);
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let allData = {}, lineChart, pieChart;
function init() {
  updateMonthLabel();
  onValue(dbRef('kakeibo'), snapshot => {
    allData = snapshot.val() || {};
    loadMonth(); recalc();
    const id = document.querySelector('.view.active')?.id;
    if (id === 'view-summary') renderSummary();
    if (id === 'view-graph') renderGraphs();
  });
}
function monthKey() { return `${currentYear}-${String(currentMonth).padStart(2,'0')}`; }
function updateMonthLabel() { document.getElementById('monthLabel').textContent = `${currentYear}年${currentMonth}月`; }
function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  updateMonthLabel(); loadMonth(); recalc();
  if (document.getElementById('view-summary').classList.contains('active')) renderSummary();
  if (document.getElementById('view-graph').classList.contains('active')) renderGraphs();
}
window.changeMonth = changeMonth;
window.switchTab = switchTab;
window.saveMonth = saveMonth;
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab')[['input','summary','graph'].indexOf(name)].classList.add('active');
  document.getElementById('view-'+name).classList.add('active');
  document.getElementById('saveBtnWrap').style.display = name === 'input' ? 'block' : 'none';
  if (name === 'summary') renderSummary();
  if (name === 'graph') renderGraphs();
}
function loadMonth() {
  const d = allData[monthKey()] || {};
  ['in','outCommon','outMa','outSue','outFixed','savings'].forEach(id => { document.getElementById(id).value = d[id] || ''; });
}
function saveMonth() {
  const d = {};
  ['in','outCommon','outMa','outSue','outFixed','savings'].forEach(id => { d[id] = parseFloat(document.getElementById(id).value) || 0; });
  set(dbRef('kakeibo/' + monthKey()), d).then(() => showToast()).catch(err => alert('保存失敗: ' + err.message));
}
function showToast() { const t = document.getElementById('toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function val(id) { return parseFloat(document.getElementById(id).value) || 0; }
function fmt(n) { return '¥ ' + Math.round(n).toLocaleString('ja-JP'); }
function recalc() {
  const c = val('outCommon') + val('outMa') + val('outSue');
  document.getElementById('cardTotal').textContent = fmt(c);
  document.getElementById('totalOut').textContent = fmt(c + val('outFixed'));
}
function renderSummary() {
  const d = allData[monthKey()], el = document.getElementById('summaryContent');
  if (!d) { el.innerHTML = '<p style="color:var(--muted);font-size:14px;text-align:center;padding:20px 0;">データがありません</p>'; return; }
  const c = (d.outCommon||0)+(d.outMa||0)+(d.outSue||0), total = c+(d.outFixed||0);
  const rows = [
    {label:'入（収入）',value:d.in||0,cls:'green'},{label:'出（共通）',value:d.outCommon||0,cls:'red'},
    {label:'出（真）',value:d.outMa||0,cls:'red'},{label:'出（末）',value:d.outSue||0,cls:'red'},
    {label:'カード合計（出）',value:c,cls:'red',bold:true},{label:'出（個）固定',value:d.outFixed||0,cls:'yellow'},
    {label:'総支出',value:total,cls:'red',bold:true},{label:'貯金額',value:d.savings||0,cls:'blue',bold:true}
  ];
  el.innerHTML = `<div class="summary-title">${currentYear}年${currentMonth}月 内訳</div>`+rows.map(r=>`<div class="summary-row"><span class="label">${r.label}</span><span class="value ${r.cls}" style="${r.bold?'font-size:16px;':''}">${fmt(r.value)}</span></div>`).join('');
}
function renderGraphs() {
  const keys = Object.keys(allData).sort();
  const labels = keys.map(k => { const [y,m]=k.split('-'); return `${y.slice(2)}/${m}`; });
  const incomes = keys.map(k => allData[k].in||0);
  const outs = keys.map(k => { const d=allData[k],c=(d.outCommon||0)+(d.outMa||0)+(d.outSue||0); return c+(d.outFixed||0); });
  const savs = keys.map(k => allData[k].savings||0);
  if (lineChart) lineChart.destroy();
  lineChart = new Chart(document.getElementById('lineChart'), {
    type:'line', data:{labels,datasets:[
      {label:'収入',data:incomes,borderColor:'#2ec87e',backgroundColor:'rgba(46,200,126,.08)',tension:.4,pointRadius:4},
      {label:'総支出',data:outs,borderColor:'#f05e6a',backgroundColor:'rgba(240,94,106,.08)',tension:.4,pointRadius:4},
      {label:'貯金',data:savs,borderColor:'#4f8ef7',backgroundColor:'rgba(79,142,247,.08)',tension:.4,pointRadius:4}
    ]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#6b728e',font:{size:11}}}},scales:{x:{ticks:{color:'#6b728e',font:{size:10}},grid:{color:'#1a1e2a'}},y:{ticks:{color:'#6b728e',font:{size:10},callback:v=>'¥'+v.toLocaleString()},grid:{color:'#1a1e2a'}}}}
  });
  const d = allData[monthKey()];
  if (pieChart) pieChart.destroy();
  if (!d) return;
  const vals = [d.outCommon||0,d.outMa||0,d.outSue||0,d.outFixed||0];
  const plabels = ['出(共通)','出(真)','出(末)','出(個)'];
  pieChart = new Chart(document.getElementById('pieChart'), {
    type:'doughnut', data:{labels:plabels.filter((_,i)=>vals[i]>0),datasets:[{data:vals.filter(v=>v>0),backgroundColor:['#f05e6a','#f5b942','#7c5cfc','#4f8ef7'],borderWidth:0}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#6b728e',font:{size:11},padding:14}},tooltip:{callbacks:{label:ctx=>` ¥${ctx.raw.toLocaleString()}`}}}}
  });
}
init();
</script>
</body>
</html>
